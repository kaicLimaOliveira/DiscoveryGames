# Dev/CI: constrói as imagens localmente.
# Uso: `docker compose --env-file .env.example up -d --build --wait` (ou copie para .env).
# Só o Caddy publica porta no host (80); o web NÃO é publicado.
name: central

x-db-url: &db-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: postgres@sha256:e6a4209d1a4893f2df3bdcde58f8926c3c929c4d51df90990ed1b36d83c1382a # postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  # minio/minio saiu do Docker Hub: imagem Chainguard fixada por digest (a mesma dos testes).
  minio:
    image: cgr.dev/chainguard/minio@sha256:18c8fa28697b25e0f34c6faae171079e88a03efb8e76a21d3b5d07b4e3cbef3e
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  # A imagem do mc não tem shell: o alias vem de MC_HOST_local e o serviço repete até o MinIO subir.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:1260ca38acf78bf8d2833845fda6636b27388ab919b750d79f2c7167fb45ec74
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET}']
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    depends_on:
      - minio
    restart: on-failure

  migrate:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: migrate
    image: central-migrate:dev
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: central-worker:dev
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      # IA opcional: chave sem valor repassa só o que existir no ambiente (nada de string vazia).
      # Sem as chaves a análise termina em "Integração de IA não configurada.".
      ANTHROPIC_API_KEY:
      GROQ_API_KEY:
      AI_MODEL:
    volumes:
      - scratch:/scratch
    healthcheck:
      # Heartbeat recente + schema pgboss instalado (dist/healthcheck.js).
      test: ['CMD', 'node', 'dist/healthcheck.js']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: central-web:dev
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGIN: ${APP_ORIGIN}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      TOTP_ISSUER: ${TOTP_ISSUER:-Central de Conteúdo}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      APP_ENCRYPTION_KEYS: ${APP_ENCRYPTION_KEYS}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      # Integrações opcionais: chave sem valor repassa só o que existir no ambiente (nada de string
      # vazia). Sem elas o painel responde 503 "Integração não configurada" nessas telas.
      META_APP_ID:
      META_APP_SECRET:
      META_GRAPH_VERSION:
      GOOGLE_OAUTH_CLIENT_ID:
      GOOGLE_OAUTH_CLIENT_SECRET:
      # Só mostra ou esconde o envio por link na interface (quem baixa é o worker).
      YTDLP_ENABLED:
    healthcheck:
      # Basta o processo responder (o /api/health devolve 503 se o storage/worker estiverem fora).
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(()=>process.exit(0),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      # O schema pgboss é criado pelo worker (role worker); o web (migrate:false) o exige ao enfileirar:
      # só sobe depois que o worker estiver saudável.
      worker:
        condition: service_healthy

  caddy:
    image: caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0 # caddy:2-alpine
    ports:
      - '80:80'
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  scratch:
  caddy_data:
  caddy_config:
